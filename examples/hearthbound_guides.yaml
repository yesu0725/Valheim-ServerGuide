              - "Animal Whisper — reduces taming time and improves tamed-creature drops."
              - "Cooking — extends food buff duration."
              - "Knowledge Sharing — progress in one skill accelerates related skills."
          topic: "New Skills"
        description: >
          Raise your Swords skill to level 50 to unlock this milestone tip.
          Continue fighting with swords — stamina cost reductions keep improving toward
          the 50% cap at level 100. New skill types are now visible in your skills panel.
        message: "ImpactfulSkills introduces three new skill types alongside the vanilla set. Voyager grants sailing bonuses including paddle speed, close-hauling, and boat durability — at level 75 your vessel becomes immune to collision impact damage. Hauling increases your carry weight. Animal Whisper reduces taming time and improves drops from tamed creatures. Cooking extends food buff duration so your meals decay slower. Finally, Knowledge Sharing lets progress in one skill accelerate learning across related skills, easing specialization for the whole party."
        rewards:
